[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sokhan"
version = "0.1.0"
description = "CPU-first, realtime, omni-style Persian voice engine (STT+LLM+TTS fused, VAD, barge-in, prosody)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
stt = ["sherpa-onnx>=1.10"]
llm = ["llama-cpp-python>=0.3.0"]
tts = ["onnxruntime>=1.17", "soundfile>=0.12", "sentencepiece>=0.2.0"]
audio = ["sounddevice>=0.4.6"]
vision = ["pillow>=10.0"]
download = ["huggingface_hub>=0.24"]
yaml = ["pyyaml>=6.0"]
full = [
    "sherpa-onnx>=1.10", "llama-cpp-python>=0.3.0", "onnxruntime>=1.17",
    "soundfile>=0.12", "sentencepiece>=0.2.0", "sounddevice>=0.4.6",
    "pillow>=10.0", "huggingface_hub>=0.24", "pyyaml>=6.0", "psutil>=5.9",
]

[tool.setuptools.packages.find]
include = ["sokhan*"]
